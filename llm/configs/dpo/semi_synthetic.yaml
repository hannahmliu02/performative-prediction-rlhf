experiment_name: dpo_semi_synthetic
sft_checkpoint: llm/outputs/checkpoints/sft/semi_synthetic_sft
model_name_or_path: gpt2-medium  # used when --skip_sft is passed
data_path: llm/outputs/data/semi_synthetic/train.parquet
dtype: bfloat16
device_map: auto
max_length: 512
num_train_epochs: 3
max_steps: -1
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 5.0e-6
warmup_steps: 10
eval_fraction: 0.1
beta: 0.1
length_norm_beta: 0.0  # set > 0 to enable (S1-Task 2, llm/training/mitigations/length_norm.py)
report_to: wandb
wandb_project: bias-llm
seed: 123
output_dir: llm/outputs/checkpoints/dpo
