# Real-world (HH-RLHF) baseline — no mitigation.

experiment_name: m1_experiment_rw
num_rounds: 5
policy_method: dpo
method: no_mitigation

sft_checkpoint: gpt2

train_data: llm/outputs/data/real_world_hh_rlhf/train.parquet
held_out_data: llm/outputs/data/real_world_hh_rlhf/audit.parquet

obs_probs:
  A: 0.8
  B: 0.4

rm_max_steps: 50
rm_lr: 1.0e-5
rm_batch_size: 4
rm_eval_fraction: 0.1

policy_max_steps: 200
policy_lr: 5.0e-6
policy_batch_size: 1
gradient_accumulation_steps: 4
policy_beta: 0.1
gradient_checkpointing: true

max_new_tokens: 64
generation_batch_size: 8
generation_n_prompts: 64
entropy_n_prompts: 0

dtype: float32
policy_dtype: float16
device_map: null
max_length: 512
dpo_max_length: 256

report_to: "none"
wandb_project: bias-llm
seed: 42

run_dt_per_round: false
run_gc_per_round: false

output_dir: llm/outputs/simulate
