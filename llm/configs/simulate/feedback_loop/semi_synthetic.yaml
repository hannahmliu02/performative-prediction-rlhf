# Full simulation on the semi-synthetic dataset: 5 rounds, GPU, bfloat16.
# Expected result: demo_B_accuracy should degrade faster than demo_A across rounds.
experiment_name: feedback_loop_semi_synthetic
num_rounds: 5
policy_method: dpo  # dpo or ppo

# Base model (SFT checkpoint from Task 4 full run)
sft_checkpoint: llm/outputs/checkpoints/sft/semi_synthetic_sft

# Data
train_data: llm/outputs/data/semi_synthetic/train.parquet
held_out_data: llm/outputs/data/semi_synthetic/audit.parquet

# Missingness
obs_probs:
  A: 0.8
  B: 0.4

# RM training (per round)
rm_max_steps: -1  # full epoch
rm_lr: 1.0e-5
rm_batch_size: 16
rm_eval_fraction: 0.1

# Policy training (per round)
policy_max_steps: -1  # full epoch
policy_lr: 5.0e-6
policy_batch_size: 8
policy_beta: 0.1

# Generation
max_new_tokens: 128
generation_batch_size: 32

# Common
dtype: bfloat16
device_map: auto
max_length: 512
report_to: wandb
wandb_project: bias-llm
seed: 123

output_dir: llm/outputs/simulate
