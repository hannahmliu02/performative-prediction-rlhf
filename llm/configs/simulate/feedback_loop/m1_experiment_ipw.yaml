# M1 / Apple Silicon experiment — IPW counterfactual debiasing (our method).
# Run AFTER m1_experiment (no-mitigation baseline) for comparison.
#
# Differences from m1_experiment.yaml:
#   - method: ours_ipw (instead of no_mitigation)
#   - mitigation block added: IPW reweighting of RM loss

experiment_name: m1_experiment_ipw
num_rounds: 5
policy_method: dpo
method: ours_ipw

sft_checkpoint: gpt2

# Data (same as baseline — generated by llm/configs/data/llm_annotated.yaml)
train_data: llm/outputs/data/llm_annotated/train.parquet
held_out_data: llm/outputs/data/llm_annotated/audit.parquet

obs_probs:
  A: 0.8
  B: 0.4

mitigation:
  type: ipw_counterfactual
  propensity_variant: oracle    # use "classifier" for the main result
  obs_probs:
    A: 0.8
    B: 0.4
  clip_eps: 0.05

# RM training (per round)
rm_max_steps: 200
rm_lr: 1.0e-5
rm_batch_size: 4
rm_eval_fraction: 0.1

# Policy training (per round)
policy_max_steps: 200
policy_lr: 5.0e-6
policy_batch_size: 1
gradient_accumulation_steps: 4
policy_beta: 0.1
gradient_checkpointing: true

# Generation
max_new_tokens: 64
generation_batch_size: 32
generation_n_prompts: 200
entropy_n_prompts: 8

# M1/MPS: no device_map → Accelerate auto-detects MPS
dtype: float32
policy_dtype: float16
device_map: null
max_length: 256
dpo_max_length: 128

report_to: "none"
wandb_project: bias-llm
seed: 42

run_dt_per_round: false
run_gc_per_round: false

output_dir: llm/outputs/simulate
