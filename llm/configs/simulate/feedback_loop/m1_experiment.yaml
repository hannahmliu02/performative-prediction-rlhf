# M1 / Apple Silicon experiment — 5-round no-mitigation baseline.
# Uses LLM-annotated data (run data generation first).
# MPS is auto-detected when device_map: null and dtype: float16.
#
# ── Model options ─────────────────────────────────────────────────────────────
# Fast baseline (no LoRA needed, ~5 min/round on M1):
#   sft_checkpoint: gpt2
#
# 7B+ with LoRA (~30-60 min/round on M1 Pro/Max, needs ≥32 GB RAM):
#   sft_checkpoint: EleutherAI/pythia-6.9b
#   lora:
#     r: 8
#     alpha: 16
#     dropout: 0.05
#     target_modules: ["query_key_value"]   # Pythia
#   # For Mistral-7B: target_modules: ["q_proj", "v_proj"]
# ──────────────────────────────────────────────────────────────────────────────

experiment_name: m1_experiment
num_rounds: 5
policy_method: dpo
method: no_mitigation

sft_checkpoint: gpt2

# Uncomment for 7B+:
# sft_checkpoint: EleutherAI/pythia-6.9b
# lora:
#   r: 8
#   alpha: 16
#   dropout: 0.05
#   target_modules: ["query_key_value"]

# Data (generated by llm/configs/data/llm_annotated.yaml)
train_data: llm/outputs/data/llm_annotated/train.parquet
held_out_data: llm/outputs/data/llm_annotated/audit.parquet

obs_probs:
  A: 0.8
  B: 0.4

# RM training (per round)
rm_max_steps: 200
rm_lr: 1.0e-5
rm_batch_size: 4
rm_eval_fraction: 0.1

# Policy training (per round)
policy_max_steps: 200
policy_lr: 5.0e-6
policy_batch_size: 1          # reduced from 2 — DPO holds policy + ref simultaneously
gradient_accumulation_steps: 4  # maintains effective batch of 4
policy_beta: 0.1
gradient_checkpointing: true  # halves activation memory during backward pass

# Generation
max_new_tokens: 32            # shorter completions; RM scores relative quality, not length
generation_batch_size: 16     # smaller batches reduce per-batch memory pressure on MPS
generation_n_prompts: 64      # 4 batches of 16; full audit still used for eval
entropy_n_prompts: 0          # skip entropy — saves ~90s of MPS warmup per round

# M1/MPS: no device_map → Accelerate auto-detects MPS
# RM uses float32 (float16 produces NaN logits on MPS for classification heads)
# Policy uses float16 (generative models are more stable in float16)
dtype: float32
policy_dtype: float16
device_map: null
max_length: 256               # RM only needs one model in memory — 256 is fine
dpo_max_length: 128           # DPO holds policy + ref simultaneously; truncates (does not filter)

report_to: "none"
wandb_project: bias-llm
seed: 42

run_dt_per_round: false
run_gc_per_round: false

output_dir: llm/outputs/simulate
