experiment_name: semi_synthetic_sft
model_name_or_path: gpt2-medium
dtype: bfloat16
device_map: auto
data_path: llm/outputs/data/semi_synthetic/train.parquet
max_length: 512
num_train_epochs: 3
max_steps: -1  # -1 means use num_train_epochs
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
warmup_ratio: 0.1
eval_fraction: 0.1
packing: false
report_to: wandb
wandb_project: bias-llm
n_sample_generations: 3
seed: 123
output_dir: llm/outputs/checkpoints/sft
