# CI smoke: same as smoke but capped to 50 samples and 3 masking steps.
# Keeps the audit under ~2 min on CPU for GitHub Actions.
experiment_name: audit_ci_smoke
rm_checkpoint: llm/outputs/checkpoints/rm/rm_smoke
data_path: llm/outputs/data/semi_synthetic/audit.parquet
dtype: float32
device_map: null
max_length: 128
batch_size: 4
n_masking_steps: 3
max_samples: 50
seed: 42
output_dir: llm/outputs/audit
