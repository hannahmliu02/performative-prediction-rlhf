# LLM-annotated resume preference data.
# The chosen summary is generated by an LLM; the rejected is a generic template.
# LLM bias (more specific summaries for Group A names) + missingness (p_B = 0.4)
# create the compound bias signal studied in the feedback-loop experiment.
#
# ── Ollama backend (free, local, runs on M1) ──────────────────────────────────
# Prerequisites:
#   brew install ollama
#   ollama pull llama3.1:8b      # or gemma2:9b, mistral, etc.
#   ollama serve                 # keep running in a separate terminal
#   python -m llm.data.generate_resume_prefs --config llm/configs/data/llm_annotated.yaml
#
# ── Anthropic backend ─────────────────────────────────────────────────────────
# Set annotator_backend: anthropic and export ANTHROPIC_API_KEY=<key>
# Model options: claude-haiku-4-5-20251001 (fast/cheap) | claude-sonnet-4-6
# ─────────────────────────────────────────────────────────────────────────────

n_per_cell: 100
roles:
  - "software engineer"
axes:
  demographic_signal:
    - A
    - B
  seniority:
    - junior
    - senior
  domain:
    - frontend
    - backend
    - ml

noise_epsilon: 0.0          # LLM output is always chosen; no artificial flip
use_llm_annotator: true
annotator_backend: "ollama"                 # "ollama" or "anthropic"
annotator_model: "llama3.1:8b"             # Ollama: any pulled model; Anthropic: claude-*
ollama_host: "http://localhost:11434"      # default Ollama address
annotator_workers: 4                       # parallel LLM calls (set OLLAMA_NUM_PARALLEL=4)

obs_probs:
  demographic_signal:
    A: 0.8
    B: 0.4

output_dir: llm/outputs/data/llm_annotated
seed: 42
