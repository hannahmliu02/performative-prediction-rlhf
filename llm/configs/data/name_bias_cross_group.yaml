# Name-bias cross-group preference data (content-controlled).
#
# Each matched triple (seniority × domain × role) produces:
#   - One A-win row: A name in prompt, shared_summary chosen, filler rejected.
#   - One B-win row: B name in prompt, filler chosen, shared_summary rejected.
#
# The chosen/rejected text is IDENTICAL across both rows in a matched pair.
# The only signal distinguishing them is the candidate name in the prompt.
# This forces the RM to latch onto names rather than content quality.
#
# obs_probs controls missingness on training rows only:
#   A-win rows appear in training ~80% of the time.
#   B-win rows appear in training ~40% of the time.
# The audit set always contains both rows from every matched pair.
#
# Run:
#   ollama serve   # in a separate terminal
#   uv run python -m llm.data.generate_resume_prefs \
#       --config llm/configs/data/name_bias_cross_group.yaml

pairing_mode: cross_group_name_bias

n_per_cell: 100
roles:
  - "software engineer"
axes:
  # demographic_signal is NOT iterated — each skeleton spans both groups.
  # It must still be present so obs_probs lookups resolve correctly.
  demographic_signal:
    - A
    - B
  seniority:
    - junior
    - senior
  domain:
    - frontend
    - backend
    - ml

noise_epsilon: 0.0
use_llm_annotator: true
annotator_backend: "ollama"
annotator_model: "llama3.1:8b"
ollama_host: "http://localhost:11434"
annotator_workers: 4

obs_probs:
  demographic_signal:
    A: 0.8
    B: 0.4

output_dir: llm/outputs/data/name_bias_cross_group
seed: 42