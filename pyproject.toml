[project]
name = "performative-prediction-rlhf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "accelerate>=0.30",
    "trl>=0.8",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "wandb>=0.17",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "structlog>=24.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
    "anthropic>=0.25",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.1",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["llm/tests"]
markers = ["slow: marks tests as slow (requires GPU)"]
