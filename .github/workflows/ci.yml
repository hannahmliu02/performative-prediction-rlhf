name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # -----------------------------------------------------------------------
  # Fast unit tests — runs on every push/PR, completes in < 3 min.
  # -----------------------------------------------------------------------
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check llm

      - name: Run tests
        run: uv run pytest llm/tests -v

  # -----------------------------------------------------------------------
  # End-to-end smoke test — CPU only, all steps capped to max_steps=2.
  # Uses ci_smoke.yaml for the audit to keep masking scoring fast.
  # Runs on every push but can be skipped with [skip smoke] in commit msg.
  # -----------------------------------------------------------------------
  smoke:
    name: Smoke test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip smoke]')"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run smoke test
        run: make smoke
